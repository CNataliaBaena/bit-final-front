<header class="header">

  <div class="logo-section">

    <span class="logo">🧁</span>

    <h1>Cat Café</h1>

  </div>

  <app-navigation></app-navigation>

  <div class="controls">

    <button (click)="fontIncrease.emit()">
      A+
    </button>

    <button (click)="darkModeToggle.emit()">
      {{ darkMode ? '☀️' : '🌙' }}
    </button>

    <button
  class="cart-btn"
  (click)="openCart()"
>
  🛒 {{ cartCount }}
</button>

  </div>

</header>
